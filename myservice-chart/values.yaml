microservice:
  # PlayStudios.MyService.WebApi — ASP.NET Core 3.1 app, built from the Dockerfile at
  # PlayStudios.MyService/PlayStudios.MyService.WebApi/Dockerfile.
  #   docker build -t rockman88v/playstudios-myservice:v1.0.0 PlayStudios.MyService/PlayStudios.MyService.WebApi
  #   docker push rockman88v/playstudios-myservice:v1.0.0
  fullnameOverride: "myservice"
  workloadType: deployment
  replicaCount: 2

  image:
    repository: rockman88v/playstudios-myservice
    tag: "v1.0.0"
    pullPolicy: IfNotPresent

  # Dockerfile already bakes ASPNETCORE_URLS=http://+:8080, no extraEnv override needed.
  containerPort: 8080
  args: []

  service:
    port: 8083

  ingress:
    enabled: true
    className: nginx
    path: /weatherforecast
    # Backend route is already /weatherforecast — no rewrite needed, forward path as-is.
    rewriteTarget: ""

  autoscaling: # chỉ có hiệu lực khi workloadType=deployment
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # No dedicated health endpoint in this app (API-only, no "/" or "/healthz" route) — reuse the
  # existing business endpoint as a pragmatic probe target. Prefer adding a real /healthz route later.
  livenessProbe:
    path: /weatherforecast
  readinessProbe:
    path: /weatherforecast
  startupProbe:
    path: /weatherforecast

  # Response body is random JSON (no fixed substring to assert) — only check HTTP 2xx.
  test:
    path: /weatherforecast
    expectedText: ""

  # ASP.NET Core may try to write Data Protection keys/temp files even with readOnlyRootFilesystem;
  # mount a writable scratch dir to avoid a CrashLoop if/when that code path is hit.
  extraVolumes:
    - name: tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp

  # replicaCount=1 (default) + minAvailable=1 (default) would block all voluntary eviction/node drain.
  # podDisruptionBudget:
  #   minAvailable: 0
  #   maxUnavailable: 1
