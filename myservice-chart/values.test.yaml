microservice:
  fullnameOverride: "myservice-test"
  replicaCount: 2
  workloadType: deployment
  image:
    repository: rockman88v/playstudios-myservice
    tag: "v1.0.0"
    pullPolicy: IfNotPresent

  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 64Mi } 

  ingress:
    enabled: true
    host: myservice-test.local

  topologySpreadConstraints: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/instance
              operator: In
              values:
              - myservice
          topologyKey: "kubernetes.io/hostname"

  autoscaling: # chỉ có hiệu lực khi workloadType=deployment
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # replicaCount=1 (default) + minAvailable=1 (default) would block all voluntary eviction/node drain.
  podDisruptionBudget:
    minAvailable: 1
    #maxUnavailable: 1
